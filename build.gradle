plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.2, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = uri("${project.projectDir}/repo")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// NeoForge binds game dependencies to main; domain tests need the same game classes.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

// Domain regressions run without a client or an existing save; no extra libraries required.
def regressionSource = file('src/test/java/com/devc/minecraftempires/PreSprint7Regression.java')
var preSprint7Regression = tasks.register('preSprint7Regression', JavaExec) {
    group = 'verification'
    description = 'Checks army, state, diplomacy, battle and save compatibility rules.'
    dependsOn tasks.named('testClasses')
    // The owner excludes local test sources from Git; a production-only checkout still builds.
    onlyIf { regressionSource.isFile() }
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.devc.minecraftempires.PreSprint7Regression'
    if (providers.gradleProperty('sprint8Scale').isPresent()) args 'sprint8-scale'
    workingDir = layout.buildDirectory.dir('regression').get().asFile
    doFirst { workingDir.mkdirs() }
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
tasks.named('check') { dependsOn preSprint7Regression }
// The domain suite is executed by JavaExec, not a JUnit engine.
tasks.named('test') { exclude '**/PreSprint7Regression*.class' }

// Opt-in real-block fixtures run in an isolated build directory, never a player's world.
// ./gradlew -PterrainWorldFixtures runGameTestServer --no-configuration-cache
if (providers.gradleProperty('terrainWorldFixtures').isPresent()) {
    if (!file('src/test/java/com/devc/minecraftempires/PreSprint7Regression.java').isFile())
        throw new GradleException('Terrain fixtures require the local PreSprint7Regression.java test source (src/test is excluded from Git).')
    def fixtureRoot = layout.buildDirectory.dir('terrain-harness/generated').get().asFile
    def replayPath = providers.gradleProperty('terrainReplayWorld').orNull
    def replayMode = replayPath != null
    def uiSmokeMode = providers.gradleProperty('terrainUiSmoke').isPresent()
    def replayDirectory = replayMode ? file(replayPath) : null
    if (replayMode && !replayDirectory.toPath().toAbsolutePath().normalize().startsWith(layout.buildDirectory.get().asFile.toPath().toAbsolutePath().normalize()))
        throw new GradleException('Replay fixtures must use an isolated directory inside build/.')
    def generateTerrainHarness = tasks.register('generateTerrainHarness') {
        outputs.dir fixtureRoot
        inputs.property('replayMode', replayMode)
        inputs.property('uiSmokeMode', uiSmokeMode)
        doLast {
            def javaFile = new File(fixtureRoot, 'java/terrainharness/Harness.java')
            javaFile.parentFile.mkdirs()
            javaFile.text = '''package terrainharness;
@net.neoforged.fml.common.Mod("terrain_harness")
public final class Harness {
    private static final boolean REPLAY = REPLAY_MODE;
    private static final boolean UI = UI_MODE;
    public Harness(net.neoforged.bus.api.IEventBus bus) {
        if (UI) { ClientOnly.register(); return; }
        net.neoforged.neoforge.common.NeoForge.EVENT_BUS.addListener((net.neoforged.neoforge.event.server.ServerStartedEvent event) -> {
            try {
                if (REPLAY) { com.devc.minecraftempires.PreSprint7Regression.startTerrainReplay(event.getServer()); return; }
                com.devc.minecraftempires.PreSprint7Regression.terrainSurfaceFixtures();
                com.devc.minecraftempires.PreSprint7Regression.terrainWorldFixtures(event.getServer().overworld());
                System.out.println("TERRAIN_BLOCK_FIXTURES_PASSED");
                System.exit(0);
            } catch (Throwable failure) { failure.printStackTrace(); if (REPLAY) Runtime.getRuntime().halt(1); else System.exit(1); }
        });
        net.neoforged.neoforge.common.NeoForge.EVENT_BUS.addListener((net.neoforged.neoforge.event.tick.ServerTickEvent.Post event) -> {
            if (!REPLAY) return;
            try {
                if (com.devc.minecraftempires.PreSprint7Regression.tickTerrainReplay(event.getServer())) { System.out.println("TERRAIN_REPLAY_FIXTURES_PASSED"); event.getServer().halt(false); }
            } catch (Throwable failure) { failure.printStackTrace(); Runtime.getRuntime().halt(1); }
        });
    }
    private static final class ClientOnly {
        static void register() {
            net.neoforged.neoforge.common.NeoForge.EVENT_BUS.addListener((net.neoforged.neoforge.client.event.ClientTickEvent.Post event) -> {
                try { com.devc.minecraftempires.PreSprint7Regression.ClientUiSmoke.tick(); }
                catch (Throwable failure) { failure.printStackTrace(); Runtime.getRuntime().halt(1); }
            });
        }
    }
}
'''.replace('REPLAY_MODE', replayMode.toString()).replace('UI_MODE', uiSmokeMode.toString())
            def metadata = new File(fixtureRoot, 'resources/META-INF/neoforge.mods.toml')
            metadata.parentFile.mkdirs()
            metadata.text = '''modLoader="javafml"
loaderVersion="[1,)"
license="All Rights Reserved"
[[mods]]
modId="terrain_harness"
version="1.0"
displayName="Isolated terrain verification"
'''
        }
    }
    sourceSets.create('terrainHarness') {
        java.srcDir new File(fixtureRoot, 'java')
        resources.srcDir new File(fixtureRoot, 'resources')
        compileClasspath += sourceSets.main.output + sourceSets.test.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.test.output
    }
    tasks.named('compileTerrainHarnessJava') { dependsOn generateTerrainHarness, tasks.named('testClasses') }
    tasks.named('processTerrainHarnessResources') { dependsOn generateTerrainHarness }
    neoForge.mods {
        "${mod_id}" { sourceSet sourceSets.test }
        terrain_harness { sourceSet sourceSets.terrainHarness }
    }
    def fixtureDirectory = providers.gradleProperty('terrainFixtureDirectory').map { file(it) }.getOrElse(layout.buildDirectory.dir('terrain-harness/world').get().asFile)
    if (!fixtureDirectory.toPath().toAbsolutePath().normalize().startsWith(layout.buildDirectory.get().asFile.toPath().toAbsolutePath().normalize()))
        throw new GradleException('Terrain fixtures must use an isolated directory inside build/.')
    neoForge.runs.gameTestServer {
        gameDirectory = fixtureDirectory
        systemProperty 'minecraftempires.coastFixtureOutput', layout.buildDirectory.file('coast-preview-render.dat').get().asFile.absolutePath
    }
    if (providers.gradleProperty('terrainNaturalOnly').isPresent()) neoForge.runs.gameTestServer {
        systemProperty 'minecraftempires.naturalOnly', 'true'
    }
    if (providers.gradleProperty('terrainOrdersOnly').isPresent()) neoForge.runs.gameTestServer {
        systemProperty 'minecraftempires.ordersOnly', 'true'
    }
    //for npc/ai states, they get their own loading criteria as to prevent server and memory lag
    if (providers.gradleProperty('terrainAIOnly').isPresent()) neoForge.runs.gameTestServer {
        systemProperty 'minecraftempires.aiOnly', 'true'
    }
    if (providers.gradleProperty('terrainMacroOnly').isPresent()) neoForge.runs.gameTestServer {
        systemProperty 'minecraftempires.macroOnly', 'true'
    }
    if (providers.gradleProperty('terrainPlayerOnly').isPresent()) neoForge.runs.gameTestServer {
        systemProperty 'minecraftempires.playerOnly', 'true'
    }
    if (providers.gradleProperty('terrainAcceptanceOnly').isPresent()) neoForge.runs.gameTestServer {
        systemProperty 'minecraftempires.acceptanceOnly', 'true'
    }
    if (providers.gradleProperty('terrainCoastOnly').isPresent()) neoForge.runs.gameTestServer {
        systemProperty 'minecraftempires.coastOnly', 'true'
    }
    if (replayMode) neoForge.runs.server {
        gameDirectory = replayDirectory
        if (providers.gradleProperty('terrainStrategicReplay').isPresent()) systemProperty 'minecraftempires.strategicReplay', 'true'
        providers.gradleProperty('sprint8Process').orNull?.with { mode -> systemProperty 'minecraftempires.sprint8Process', mode }
    }
    if (uiSmokeMode) neoForge.runs.client {
        gameDirectory = layout.buildDirectory.dir('terrain-harness/client').get().asFile
        systemProperty 'minecraftempires.coastFixtureOutput', layout.buildDirectory.file('coast-preview-render.dat').get().asFile.absolutePath
        programArguments.addAll '--width', '1280', '--height', '900'
    }
}
